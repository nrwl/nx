extends: existence
message: "Don't use a spaced hyphen as a dash. Use a comma, parentheses, or separate sentences."
level: warning
scope: paragraph
nonword: true
tokens:
  # Skips Markdoc tag attributes, which TokenIgnores doesn't hide from this rule.
  # The newline in the lookahead catches a hyphen that ends a wrapped line.
  - '(?<!\{%[^%]*)(?<=\S) -(?=[ \n]\S)'
