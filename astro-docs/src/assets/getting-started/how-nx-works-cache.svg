<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 250" font-family="Inter, system-ui, sans-serif">
<style>
  .card { fill: #FFFFFF; stroke: #CBD5E1; }
  .card.faded { fill: none; stroke: #CBD5E1; stroke-dasharray: 5 5; }
  .name { fill: #0F172A; font-size: 15px; font-weight: 600; }
  .path { fill: #64748B; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tag { fill: #64748B; font-size: 11px; }
  .faded-text { opacity: 0.45; }
  .pill { fill: none; stroke: #6366F1; stroke-width: 1.5; }
  .pill.hit { fill: #6366F1; fill-opacity: 0.12; stroke: #94A3B8; }
  .pill.run { stroke: #F43F5E; }
  .task { fill: #0F172A; font-size: 13px; }
  .status { font-size: 11px; font-weight: 600; }
  .status.hit { fill: #6366F1; }
  .status.run { fill: #F43F5E; }
  .edge { fill: none; stroke: #94A3B8; stroke-width: 1.5; }
  .edge.task-edge { stroke: #6366F1; }
  .head { fill: #94A3B8; }
  .head.task-edge { fill: #6366F1; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #0F172A; stroke: #334155; }
    .card.faded { fill: none; stroke: #475569; }
    .name, .task { fill: #F1F5F9; }
    .path, .tag { fill: #94A3B8; }
    .pill.hit { fill-opacity: 0.2; }
    .status.hit { fill: #A5B4FC; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
  <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head task-edge" d="M0 0L10 5L0 10z"/></marker>
</defs>
<path class="edge task-edge" d="M220 120 C220 134 110 134 110 148" marker-end="url(#t)"/>
<path class="edge task-edge" d="M220 120 C220 134 330 134 330 148" marker-end="url(#t)"/>
<rect class="card" x="130" y="20" width="180" height="100" rx="10"/>
<g><text class="name" x="146" y="46">web</text><text class="tag" x="294" y="46" text-anchor="end">React</text><text class="path" x="146" y="65">apps/web</text></g>
<rect class="pill run" x="142" y="78" width="156" height="30" rx="6"/><text class="task" x="156" y="98">build</text><text class="status run" x="284" y="98" text-anchor="end">runs</text>
<rect class="card" x="20" y="150" width="180" height="100" rx="10"/>
<g><text class="name" x="36" y="176">ui</text><text class="tag" x="184" y="176" text-anchor="end">React</text><text class="path" x="36" y="195">packages/ui</text></g>
<rect class="pill hit" x="32" y="208" width="156" height="30" rx="6"/><text class="task" x="46" y="228">build</text><text class="status hit" x="174" y="228" text-anchor="end">cache hit</text>
<rect class="card" x="240" y="150" width="180" height="100" rx="10"/>
<g><text class="name" x="256" y="176">utils</text><text class="tag" x="404" y="176" text-anchor="end">TypeScript</text><text class="path" x="256" y="195">packages/utils</text></g>
<rect class="pill hit" x="252" y="208" width="156" height="30" rx="6"/><text class="task" x="266" y="228">build</text><text class="status hit" x="394" y="228" text-anchor="end">cache hit</text>
</svg>
