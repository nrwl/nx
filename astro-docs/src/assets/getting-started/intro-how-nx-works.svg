<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 220" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- 1. Project graph -->
  <rect x="60" y="15" width="100" height="50" rx="8" fill="#94A3B8"/>
  <text x="110" y="45" font-size="15" fill="white" text-anchor="middle">myapp</text>
  <rect x="5" y="115" width="100" height="50" rx="8" fill="#94A3B8"/>
  <text x="55" y="145" font-size="15" fill="white" text-anchor="middle">ui</text>
  <rect x="115" y="115" width="100" height="50" rx="8" fill="#94A3B8"/>
  <text x="165" y="145" font-size="15" fill="white" text-anchor="middle">utils</text>
  <path d="M 95 65 L 65 113" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 125 65 L 155 113" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="110" y="205" font-size="13" fill="#94A3B8" text-anchor="middle">1. Project graph</text>

  <path d="M 222 90 L 250 90" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 2. Task graph -->
  <rect x="260" y="15" width="100" height="50" rx="8" fill="#6366F1"/>
  <text x="310" y="45" font-size="14" fill="white" text-anchor="middle">ui:build</text>
  <rect x="370" y="15" width="100" height="50" rx="8" fill="#6366F1"/>
  <text x="420" y="45" font-size="14" fill="white" text-anchor="middle">utils:build</text>
  <rect x="315" y="115" width="100" height="50" rx="8" fill="#6366F1"/>
  <text x="365" y="145" font-size="14" fill="white" text-anchor="middle">myapp:build</text>
  <path d="M 310 65 L 345 113" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 420 65 L 385 113" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="365" y="205" font-size="13" fill="#94A3B8" text-anchor="middle">2. Task graph</text>

  <path d="M 478 90 L 506 90" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 3. Cache -->
  <rect x="570" y="15" width="110" height="50" rx="8" fill="#94A3B8"/>
  <text x="625" y="45" font-size="14" fill="white" text-anchor="middle">hash inputs</text>
  <rect x="515" y="115" width="100" height="50" rx="8" fill="#F43F5E"/>
  <text x="565" y="137" font-size="14" fill="white" text-anchor="middle">replay</text>
  <text x="565" y="154" font-size="11" fill="white" fill-opacity="0.85" text-anchor="middle">cache hit</text>
  <rect x="625" y="115" width="100" height="50" rx="8" fill="#94A3B8"/>
  <text x="675" y="137" font-size="14" fill="white" text-anchor="middle">run + store</text>
  <text x="675" y="154" font-size="11" fill="white" fill-opacity="0.85" text-anchor="middle">cache miss</text>
  <path d="M 610 65 L 580 113" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 640 65 L 665 113" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="620" y="205" font-size="13" fill="#94A3B8" text-anchor="middle">3. Cache</text>
</svg>
