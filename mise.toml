[tools]
bun = "1.3"
# Keep Java 24 as the default runtime; Gradle compiles with JDK 17.
java = ["24", "temurin-17"]
node = "{{ env['NODE_VERSION'] | default(value='26.7.0') }}"
maven = "3.9.11"
rust = "1.95.0"
vale = "3.13.1"

# Ensure that the packageManager field gets used to resolve the correct version of pnpm
# https://github.com/jdx/mise/discussions/3549#discussioncomment-11918572
"npm:corepack" = "latest"

# dotnet via mise only works on Linux/macOS.
# On Windows, the vfox plugin is buggy: https://github.com/jdx/mise/discussions/4738
[tools.dotnet]
version = "9"
os = ["linux", "macos"]

[env]
# Match the second Java version above and expose it to Gradle toolchain discovery.
# It may not exist yet while mise installs tools on a fresh machine.
JAVA17_HOME = { value = "{{ tools.java[1].path | default(value='') }}", tools = true }
