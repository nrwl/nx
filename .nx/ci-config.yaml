dte:
  distribute-on:
    extra-small-changeset: 3 linux-large, 2 linux-extra-large
    small-changeset: 4 linux-large, 2 linux-extra-large
    medium-changeset: 4 linux-large, 3 linux-extra-large
    large-changeset: 4 linux-large, 4 linux-extra-large
    extra-large-changeset: 5 linux-large, 5 linux-extra-large
  main-job-worker: false
  scheduling-constraints:
    - projects: ['nx', 'workspace', 'remix', 'nx-maven-plugin']
      targets: ['install', 'test']
      cannot-run-with:
        - projects: ['nx', 'workspace', 'remix', 'nx-maven-plugin']
          targets: ['install', 'test']

    # Module federation e2e tests build + serve a host and its remotes (several
    # webpack/rspack builds at once) — each one saturates ~7 cores. Pin them to
    # the larger extra-large agents, one per machine. Must precede e2e-ci**.
    - targets: ['e2e-ci--src/module-federation**']
      cannot-run-with:
        - targets: ['e2e-ci--src/module-federation**']

    - targets: ['bench*']
      cannot-run-with:
        - targets: ['bench*']

    # The JVM-heavy e2e suites use the most CPU, much of it in Gradle/Kotlin daemons
    # their task profiles don't count, so agents get overpacked with them. One per agent.
    - projects: ['e2e-gradle', 'e2e-maven', 'e2e-nx-build']
      targets: ['e2e-ci--src/**']
      cannot-run-with:
        - projects: ['e2e-gradle', 'e2e-maven', 'e2e-nx-build']
          targets: ['e2e-ci--src/**']

lifecycle:
  stop-after:
    - e2e
