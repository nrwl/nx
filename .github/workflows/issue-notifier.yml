name: Issue Statistics

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      skip_slack:
        description: Skip the Slack message. The report still goes to the job summary.
        type: boolean
        default: true
      skip_cache_upload:
        description: Leave the cached report data untouched, so the next scheduled run still diffs against the last real report.
        type: boolean
        default: true
      fenced_tables:
        description: Post the tables as fixed-width markdown in a code fence instead of Block Kit table blocks.
        type: boolean
        default: false

permissions:
  issues: read
  pull-requests: read

jobs:
  issues-report:
    if: ${{ github.repository_owner == 'nrwl' }}
    runs-on: ubuntu-latest
    name: Report status
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4.1.0

      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '24'
          check-latest: true
          cache: 'pnpm'

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          name: cached-issue-data
          path: ${{ github.workspace }}/scripts/issues-scraper/cached
          search_artifacts: true
          allow_forks: false
        continue-on-error: true

      - name: Collect Issue Data
        id: collect
        run: npx tsx ./scripts/issues-scraper/index.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_FENCED_TABLES: ${{ inputs.fenced_tables || vars.SLACK_FENCED_TABLES }}

      - uses: actions/upload-artifact@v4.6.2
        if: ${{ !inputs.skip_cache_upload }}
        with:
          name: cached-issue-data
          path: ./scripts/issues-scraper/cached/data.json

      - name: Send GitHub Action trigger data to Slack workflow
        id: slack
        if: ${{ !inputs.skip_slack }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_ISSUES_REPORT_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.collect.outputs.SLACK_MESSAGE }}
